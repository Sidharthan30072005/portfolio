<!-- Contact Form for Embedding in Portfolio -->
<!-- Copy this HTML and paste it into your portfolio's contact section -->

<div class="contact-form-container">
    <form action="https://formsubmit.co/sidharthan302005@gmail.com" method="POST" class="contact-form">
        <!-- Anti-spam protection -->
        <input type="hidden" name="_captcha" value="false">
        
        <!-- Redirect to custom thank you page -->
        <input type="hidden" name="_next" value="https://sidharthan30072005.github.io/thanks.html">
        
        <!-- Subject line for emails -->
        <input type="hidden" name="_subject" value="New Portfolio Contact - Sidharthan T">
        
        <!-- Template for email body -->
        <input type="hidden" name="_template" value="table">

        <div class="form-group">
            <label for="name">Name *</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Your full name" 
                required
                class="form-input"
            >
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="your.email@example.com" 
                required
                class="form-input"
            >
        </div>

        <div class="form-group">
            <label for="message">Message *</label>
            <textarea 
                id="message" 
                name="message" 
                placeholder="Tell me about your project, opportunity, or just say hello..." 
                required
                rows="5"
                class="form-textarea"
            ></textarea>
        </div>

        <button type="submit" class="submit-button">
            Send Message
        </button>
    </form>
</div>

<style>
/* CSS for the embedded form - add this to your portfolio's CSS */
.contact-form-container {
    max-width: 600px;
    margin: 0 auto;
}

.contact-form {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    color: #ffffff;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.95rem;
}

.form-input,
.form-textarea {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 1rem;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
    font-family: inherit;
}

.form-input:focus,
.form-textarea:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    background: rgba(255, 255, 255, 0.08);
}

.form-input::placeholder,
.form-textarea::placeholder {
    color: #888888;
}

.form-textarea {
    resize: vertical;
    min-height: 120px;
}

.submit-button {
    width: 100%;
    padding: 16px 32px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.submit-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

.submit-button:active {
    transform: translateY(0);
}

.submit-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

.submit-button:hover::before {
    left: 100%;
}

/* Responsive Design */
@media (max-width: 768px) {
    .contact-form {
        padding: 30px 20px;
    }
}

@media (max-width: 480px) {
    .contact-form {
        padding: 25px 15px;
    }
    
    .form-input,
    .form-textarea {
        padding: 12px 16px;
    }
    
    .submit-button {
        padding: 14px 24px;
        font-size: 1rem;
    }
}
</style>

<script>
// JavaScript for form submission feedback - add this to your portfolio's JS
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.contact-form');
    if (form) {
        form.addEventListener('submit', function(e) {
            const submitBtn = form.querySelector('.submit-button');
            submitBtn.textContent = 'Sending...';
            submitBtn.style.opacity = '0.7';
            submitBtn.style.pointerEvents = 'none';
        });
    }
});
</script>
