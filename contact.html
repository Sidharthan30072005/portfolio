<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Sidharthan T</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out',
                        'slide-up': 'slideUp 0.8s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
    <!-- Animated Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-80 h-80 bg-purple-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-float"></div>
        <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-float" style="animation-delay: -1.5s;"></div>
        <div class="absolute top-40 left-40 w-80 h-80 bg-pink-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-float" style="animation-delay: -3s;"></div>
    </div>

    <div class="relative z-10 w-full max-w-2xl">
        <!-- Contact Form Card -->
        <div class="bg-white/10 glass-effect border border-white/20 rounded-3xl p-8 md:p-12 shadow-2xl animate-slide-up">
            <!-- Header -->
            <div class="text-center mb-10 animate-fade-in">
                <div class="w-20 h-20 gradient-bg rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                    Get In Touch
                </h1>
                <p class="text-gray-300 text-lg md:text-xl leading-relaxed max-w-md mx-auto">
                    I'm always open to discussing new opportunities, interesting projects, or just having a chat about technology and development.
                </p>
            </div>

            <!-- Contact Form -->
            <form action="https://formsubmit.co/sidharthan302005@gmail.com" method="POST" class="space-y-6">
                <!-- Formsubmit Advanced Features -->
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://sidharthan30072005.github.io/thanks.html">
                <input type="hidden" name="_subject" value="New Portfolio Contact - Sidharthan T">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_replyto" value="email">
                <input type="hidden" name="_autoresponse" value="Thank you for reaching out! I've received your message and will get back to you within 24 hours. - Sidharthan T">
                <input type="hidden" name="_blacklist" value="spam,viagra,cialis,loan,casino,porn,sex">

                <!-- Name and Email Row -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="name" class="block text-sm font-semibold text-white">
                            Full Name *
                        </label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            class="w-full px-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-400 input-focus transition-all duration-300"
                            placeholder="Enter your full name"
                        >
                    </div>
                    
                    <div class="space-y-2">
                        <label for="email" class="block text-sm font-semibold text-white">
                            Email Address *
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="w-full px-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-400 input-focus transition-all duration-300"
                            placeholder="your.email@example.com"
                        >
                    </div>
                </div>

                <!-- Message -->
                <div class="space-y-2">
                    <label for="message" class="block text-sm font-semibold text-white">
                        Message *
                    </label>
                    <textarea
                        id="message"
                        name="message"
                        required
                        rows="6"
                        class="w-full px-4 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-blue-400 input-focus transition-all duration-300 resize-none"
                        placeholder="Tell me about your project, opportunity, or just say hello..."
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full gradient-bg text-white font-semibold py-4 px-8 rounded-xl text-lg transition-all duration-300 btn-hover flex items-center justify-center space-x-2 group"
                >
                    <span>Send Message</span>
                    <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>

            <!-- Contact Info -->
            <div class="mt-10 pt-8 border-t border-white/20 text-center">
                <p class="text-gray-300 mb-2">
                    Or reach out directly at: 
                    <a href="mailto:sidharthan302005@gmail.com" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors duration-300">
                        sidharthan302005@gmail.com
                    </a>
                </p>
                <p class="text-gray-400 text-sm">
                    📍 Tamil Nadu, India
                </p>
            </div>
        </div>

        <!-- Back to Portfolio Link -->
        <div class="text-center mt-8 animate-fade-in" style="animation-delay: 0.3s;">
            <a 
                href="https://sidharthan30072005.github.io/" 
                class="inline-flex items-center space-x-2 text-gray-300 hover:text-white transition-colors duration-300"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Portfolio</span>
            </a>
        </div>
    </div>

    <!-- Loading Animation Script -->
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const button = document.querySelector('button[type="submit"]');
            const originalText = button.innerHTML;
            
            button.innerHTML = `
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Sending...
            `;
            button.disabled = true;
        });
    </script>
</body>
</html>
